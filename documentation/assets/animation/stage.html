<!doctype html>
<!-- stage.html — open as stage.html?scene=interp (render.py does this for you).
     Load order: specs.js (data) → helpers.js → common.js → scenes/<scene>.js (builds the frame). -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body><div id="stage"></div>
<script src="specs.js"></script>
<script src="helpers.js"></script>
<script src="common.js"></script>
<script>
  const scene = new URLSearchParams(location.search).get('scene');
  if (!window.SPECS[scene]) throw new Error('Unknown ?scene= key');
  const el = document.createElement('script'); el.src = `scenes/${scene}.js`; document.body.appendChild(el);
</script>
</body></html>
