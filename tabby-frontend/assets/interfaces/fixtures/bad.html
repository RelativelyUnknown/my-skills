<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title></title>
<style>
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#fff;color:#14171f}
.low{color:#b8bcc6}
.wide{width:700px;height:20px;background:#eee}
.tiny-btn{width:16px;height:16px;padding:0;border:1px solid #888}
a:focus,button:focus,input:focus{outline:none}
.grad{background:linear-gradient(90deg,#6a5cff,#ff5c9d);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;font-size:28px}
.hard{box-shadow:6px 6px 0 #000;padding:12px;margin:12px 0}
.stripe{border-left:4px solid #2f5bea;padding:8px 12px;margin:12px 0}
.glow{box-shadow:0 0 32px rgba(106,92,255,.7);padding:12px;margin:12px 0}
.small{font-size:10px}
.pulse{width:12px;height:12px;border-radius:50%;background:#2f5bea;animation:p 1s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.6)}}
</style></head>
<body>
<h1>Orders</h1><h3>Recent</h3>
<p class="low">Every order placed through the API.</p>
<div class="wide"></div>
<button class="tiny-btn" aria-label="Close">x</button>
<a href="#x">Skip</a> <input name="sku">
<img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="40" height="40">
<p class="grad">Ship faster</p>
<div class="hard">Hard shadow card</div><div class="stripe">Stripe callout</div><div class="glow">Glow card</div>
<p class="small">Fine print at ten pixels.</p><div class="pulse"></div>
</body></html>
