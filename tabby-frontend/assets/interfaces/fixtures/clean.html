<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orders: billhook</title>
<style>
:root{--surface:#fff;--ink:#14171f;--label:#5b6270;--accent:#2f5bea;--hair:#dadee6;--zone:#f5f6f9;--sans:Inter,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--surface:#0e1016;--ink:#f1f3f8;--label:#9ba3b4;--accent:#7c9bff;--hair:#2a3042;--zone:#151824}}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font:16px/1.5 var(--sans)}
header,main{max-width:68ch;margin:0 auto;padding:16px}
nav a{display:inline-block;padding:12px 8px;color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-size:28px;line-height:1.2;margin:16px 0 8px}h2{font-size:20px;margin:24px 0 8px}
p{margin:0 0 12px;max-width:68ch}.muted{color:var(--label)}
.card{background:var(--zone);border:1px solid var(--hair);border-radius:14px;padding:16px;margin:12px 0}
label{display:block;font-weight:600;margin:12px 0 4px}
input{font:inherit;min-height:44px;width:100%;padding:8px 12px;border:1px solid var(--hair);border-radius:10px;background:var(--surface);color:var(--ink)}
button{font:inherit;font-weight:600;min-height:44px;padding:8px 20px;border:0;border-radius:999px;background:var(--accent);color:#fff;margin-top:12px}
.spin{width:16px;height:16px;border:2px solid var(--hair);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style></head>
<body>
<header><nav aria-label="Main"><a href="#orders">Orders</a> <a href="#new">New order</a></nav></header>
<main>
<h1>Orders</h1>
<p class="muted">Every order placed through the API, newest first.</p>
<h2 id="orders">Recent</h2>
<div class="card"><p>Order 1042 is waiting for payment.</p><div class="spin" role="status" aria-label="Loading"></div></div>
<img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="Chart of orders per day" width="40" height="40">
<h2 id="new">New order</h2>
<form><label for="sku">SKU</label><input id="sku" name="sku" autocomplete="off"><button type="submit">Place order</button></form>
</main></body></html>
