<marker id="fan-ml" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="mkl" d="M1 1 L9 5 L1 9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="984" height="496" fill="var(--surface)"/>
<text x="40" y="64" font-size="28" font-weight="650" letter-spacing="-0.4">How Tabby routes a task</text>
<text class="l" x="40" y="92" font-size="15">Only the modules a task needs are read. Everything else stays out of context.</text>
