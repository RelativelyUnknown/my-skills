# Use tox when the project must be tested on several Python versions locally or in CI; one version
# is simpler with the Makefile. `tox` runs everything; one test on one version:
#   tox -e py313 -- tests/test_orders.py::test_refund
# `dependency_groups` needs tox 4.22 or newer (PEP 735). Not run here: set the versions from the
# project's Python target and check it once before relying on it.
[tox]
env_list = lint, types, py312, py313

[testenv]
description = tests on {base_python}
dependency_groups = dev
commands = pytest {posargs}

[testenv:lint]
description = lint and check formatting
skip_install = true
deps = ruff
commands =
    ruff check .
    ruff format --check .

[testenv:types]
description = type check
dependency_groups = dev
commands = mypy src tests
