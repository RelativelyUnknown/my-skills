<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 300" width="812" height="300" role="img" aria-labelledby="shop-title shop-desc" data-diagram="1">
<title id="shop-title">Orders and who places them</title>
<desc id="shop-desc">One user places many orders; each order holds many items.</desc>
<defs><style>:root{--surface:#FFFFFF;--zone:#F5F6F9;--node:#FFFFFF;--hair:#DADEE6;--ink:#14171F;--label:#5B6270;--accent:#2F5BEA;--accent-text:#2F5BEA;--accent-tint:#E8EEFF;--tile:#EEF0F5;--tile-ink:#3A4152;--line:#7A8294;--on-accent:#FFFFFF;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--surface:#0E1016;--zone:#151824;--node:#171B28;--hair:#2A3042;--ink:#F1F3F8;--label:#9BA3B4;--accent:#7C9BFF;--accent-text:#7C9BFF;--accent-tint:#1C2547;--tile:#20263A;--tile-ink:#C7CEDF;--line:#6A748C;--on-accent:#0E1016}}
text{font-family:var(--sans);fill:var(--ink)}
.m{font-family:var(--mono)}.l{fill:var(--label)}.a{fill:var(--accent-text)}.on{fill:var(--on-accent)}
.mka{fill:none;stroke:var(--accent)}.mkl{fill:none;stroke:var(--line)}</style>
<marker id="shop-ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="mka" d="M1 1 L9 5 L1 9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="shop-ml" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="mkl" d="M1 1 L9 5 L1 9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="812" height="300" fill="var(--surface)"/>
<text x="40" y="64" font-size="28" font-weight="650" letter-spacing="-0.4">Orders and who places them</text>
<text class="l" x="40" y="92" font-size="15">One user places many orders; each order holds many items.</text>
<path data-edge="users&gt;orders" data-kind="main" d="M172,190 H328" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shop-ma)"/>
<path data-edge="orders&gt;items" data-kind="main" d="M476,190 H620" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shop-ma)"/>
<g data-pill="users&gt;orders"><rect x="224" y="180" width="52" height="24" rx="12" fill="var(--surface)" stroke="var(--accent)" stroke-width="1"/><text class="a" x="250" y="196" font-size="10.5" font-weight="600" letter-spacing="0.5" text-anchor="middle">1 : N</text></g>
<g data-pill="orders&gt;items"><rect x="524" y="180" width="52" height="24" rx="12" fill="var(--surface)" stroke="var(--accent)" stroke-width="1"/><text class="a" x="550" y="196" font-size="10.5" font-weight="600" letter-spacing="0.5" text-anchor="middle">1 : N</text></g>
<g data-node="users"><rect data-box="1" x="40" y="140" width="128" height="100" rx="14" fill="var(--node)" stroke="var(--hair)" stroke-width="1.25"/>
<text x="56" y="168" font-size="14" font-weight="650">users</text>
<line x1="40" y1="184" x2="168" y2="184" stroke="var(--hair)" stroke-width="1"/>
<text class="m" x="56" y="208" font-size="12">id</text>
<text class="m l" x="152" y="208" font-size="12" text-anchor="end">uuid</text>
<text class="m" x="56" y="232" font-size="12">email</text>
<text class="m l" x="152" y="232" font-size="12" text-anchor="end">text</text>
</g>
<g data-node="orders" data-focal="1"><rect data-box="1" x="332" y="128" width="140" height="124" rx="14" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.75"/>
<text x="348" y="156" font-size="14" font-weight="650">orders</text>
<line x1="332" y1="172" x2="472" y2="172" stroke="var(--hair)" stroke-width="1"/>
<text class="m" x="348" y="196" font-size="12">id</text>
<text class="m l" x="456" y="196" font-size="12" text-anchor="end">uuid</text>
<text class="m" x="348" y="220" font-size="12">user_id</text>
<text class="m l" x="456" y="220" font-size="12" text-anchor="end">uuid</text>
<text class="m" x="348" y="244" font-size="12">status</text>
<text class="m l" x="456" y="244" font-size="12" text-anchor="end">text</text>
</g>
<g data-node="items"><rect data-box="1" x="624" y="128" width="148" height="124" rx="14" fill="var(--node)" stroke="var(--hair)" stroke-width="1.25"/>
<text x="640" y="156" font-size="14" font-weight="650">order_items</text>
<line x1="624" y1="172" x2="772" y2="172" stroke="var(--hair)" stroke-width="1"/>
<text class="m" x="640" y="196" font-size="12">order_id</text>
<text class="m l" x="756" y="196" font-size="12" text-anchor="end">uuid</text>
<text class="m" x="640" y="220" font-size="12">sku</text>
<text class="m l" x="756" y="220" font-size="12" text-anchor="end">text</text>
<text class="m" x="640" y="244" font-size="12">qty</text>
<text class="m l" x="756" y="244" font-size="12" text-anchor="end">int</text>
</g>
</svg>
