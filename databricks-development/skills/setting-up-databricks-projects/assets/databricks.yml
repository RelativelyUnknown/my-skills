# Declarative Automation Bundle (formerly Databricks Asset Bundle). Replace <pkg>, <host> and
# <service-principal-application-id>. Validate after every change:
#   databricks bundle validate --strict -t dev
bundle:
  name: <pkg>

include:
  - resources/*.yml

artifacts:
  wheel:
    type: whl
    build: uv build --wheel

variables:
  catalog:
    description: Unity Catalog catalog for this target
  schema:
    description: Schema for this target

targets:
  dev:
    mode: development          # prefixes resources with the user's name and pauses schedules
    default: true
    workspace:
      host: https://<host>
    variables:
      catalog: dev
      schema: ${workspace.current_user.short_name}

  prod:
    mode: production
    workspace:
      host: https://<host>
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: <service-principal-application-id>
    variables:
      catalog: prod
      schema: <pkg>
    permissions:
      - group_name: data-engineers
        level: CAN_VIEW
