# .github/workflows/deploy.yml — checks on every pull request, deploys prod from main.
# One-time setup by a person: a service principal with a GitHub federation policy for
# environment "prod", repository variable DATABRICKS_HOST, and secret DATABRICKS_CLIENT_ID
# (the service principal's application ID). No token is stored.
name: deploy
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-java@v6.1.0     # local Spark for unit tests
        with:
          distribution: temurin
          java-version: "17"
      - run: uv sync --locked --group spark-local
      - run: uv run ruff check .
      - run: uv run pytest tests/unit

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write                       # only this job can mint the OIDC token
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_BUNDLE_TARGET: prod
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: databricks/setup-cli@v1.23.0
      - run: databricks bundle validate --strict
      - run: databricks bundle deploy
